services:
  router:
    build: { context: ., target: prod }
    image: llama-router:1.2.0
    container_name: llama-router
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./backends.json
        target: /app/backends.json
        bind:
          create_host_path: false
      - type: bind
        source: ./embedding_pools.json
        target: /app/embedding_pools.json
        bind:
          create_host_path: false
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  router-canary:
    profiles: ["canary"]
    build: { context: ., target: prod }
    image: llama-router:1.2.0
    container_name: llama-router-canary
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: ./backends.json
        target: /app/backends.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./embedding_pools.json
        target: /app/embedding_pools.json
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  router-test:
    profiles: ["test"]
    build: { context: ., target: test }
    volumes:
      - type: bind
        source: ./backends.json
        target: /app/backends.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./embedding_pools.json
        target: /app/embedding_pools.json
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - .env
services:
  router:
    image: python:3.12-slim
    container_name: llama-router
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
    env_file:
      - .env
    working_dir: /app
    environment:
      - API_KEY=${API_KEY}
    command: >
      bash -c "pip install --no-cache-dir fastapi==0.143.3 uvicorn==0.54.0 httpx==0.28.1 python-dotenv==1.2.4 jinja2==3.1.6 &&
               uvicorn router:app --host 0.0.0.0 --port 80"
    restart: unless-stopped

